#
# Desktop lock. Fails when a change touches the desktop implementation (the Avalonia app, the
# shared Core and AI projects, tests, solution/SDK pins) without the explicit override token
# [desktop-change] in a commit message. Web-only work (src/LudoNimArena.Browser, wwwroot,
# release workflow) is unaffected. See scripts/check_desktop_lock.sh.
name: Desktop Lock

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lock:
    name: Desktop files unchanged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check locked paths
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"; head="${{ github.sha }}"
          fi
          bash scripts/check_desktop_lock.sh "$base" "$head"
