#
# Builds Ludo Arena on every GitHub-hosted runner and CPU architecture, then
# actually LAUNCHES the real Avalonia desktop application and plays one complete
# game — first roll to declared winner — capturing the transcript as proof.
#
# The app is driven by its documented, opt-in environment switches; no test
# double or simulation is used. Linux runners have no display, so the real GUI
# is launched inside a virtual X server (Xvfb).
name: Play Full Game (All Runners)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/play-full-game.yml'

permissions:
  contents: read

env:
  LUDO_AUTOSTART: '1'
  LUDO_SPEED: '80'
  LUDO_EXIT_ON_GAMEOVER: '1'

jobs:
  play:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.label }}
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        label:
          - ubuntu-24.04
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - ubuntu-22.04-arm
          - windows-2025
          - windows-2022
          - windows-11-arm
          - macos-15
          - macos-14
          - macos-15-intel
          - macos-13
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Record runner identity
        shell: bash
        run: |
          mkdir -p proof
          {
            echo "runner label : ${{ matrix.label }}"
            echo "RUNNER_OS    : $RUNNER_OS"
            echo "RUNNER_ARCH  : $RUNNER_ARCH"
            echo "machine      : $(uname -s -m 2>/dev/null || echo 'n/a')"
            echo "dotnet SDK   : $(dotnet --version)"
          } | tee proof/environment.txt

      - name: Restore
        shell: bash
        run: dotnet restore LudoNimArena.slnx

      - name: Build (Release)
        shell: bash
        run: dotnet build LudoNimArena.slnx -c Release --no-restore

      - name: Run unit tests
        shell: bash
        run: dotnet test LudoNimArena.slnx -c Release --no-build

      - name: Install virtual display (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libx11-6 libice6 libsm6 libfontconfig1

      - name: Play one complete game (Linux, real GUI under Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        env:
          LUDO_TRANSCRIPT: ${{ github.workspace }}/proof/transcript.txt
        run: |
          xvfb-run -a --server-args="-screen 0 1280x900x24" \
            dotnet run --project src/LudoNimArena.App -c Release --no-build

      - name: Play one complete game (Windows / macOS, real GUI)
        if: runner.os != 'Linux'
        shell: bash
        env:
          LUDO_TRANSCRIPT: ${{ github.workspace }}/proof/transcript.txt
        run: dotnet run --project src/LudoNimArena.App -c Release --no-build

      - name: Verify a full game was completed
        shell: bash
        run: |
          T=proof/transcript.txt
          test -f "$T" || { echo "::error::no transcript produced"; exit 1; }
          grep -q '^GAME COMPLETE$' "$T" || { echo "::error::game did not reach a winner"; tail -20 "$T"; exit 1; }
          WINNER=$(grep '^WINNER: ' "$T" | tail -1)
          TURNS=$(grep '^TURNS: '  "$T" | tail -1 | cut -d' ' -f2)
          LINES=$(wc -l < "$T" | tr -d ' ')
          echo "$WINNER"
          echo "turns: $TURNS   transcript lines: $LINES"
          {
            echo "### ${{ matrix.label }} — $RUNNER_OS / $RUNNER_ARCH"
            echo ""
            echo "| check | result |"
            echo "|---|---|"
            echo "| .NET SDK | \`$(dotnet --version)\` |"
            echo "| machine | \`$(uname -s -m 2>/dev/null || echo n/a)\` |"
            echo "| build | Release, 0 errors |"
            echo "| full game | **completed** |"
            echo "| ${WINNER%%:*} | ${WINNER#*: } |"
            echo "| turns played | $TURNS |"
            echo "| transcript lines | $LINES |"
            echo ""
            echo "First and last events:"
            echo '```'
            head -4 "$T"
            echo '...'
            tail -5 "$T"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-${{ matrix.label }}
          path: proof/
          if-no-files-found: warn
