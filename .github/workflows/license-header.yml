#
# Mandatory gate: every project source file must carry the SANYALnet Labs license
# header. This workflow fails the push / pull request if any file is missing it.
name: License Header Gate

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  license-header:
    name: Verify mandatory license headers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Enforce SANYALnet Labs license header on all source files
        run: bash scripts/check_license_headers.sh
