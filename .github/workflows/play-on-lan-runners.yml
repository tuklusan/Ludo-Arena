#
# Plays a full game on SELF-HOSTED runners (physical machines on a private LAN).
#
# SECURITY: manual dispatch only. This workflow must never be given a
# pull_request trigger — self-hosted runners on a public repository would then
# execute untrusted fork code on real hardware.
#
# On Linux the game can be pointed at an X server running on another machine
# (e.g. MobaXterm on a desktop) so the board is visible live. Windows and macOS
# use native windowing and have no X11 back end, so they always display on their
# own console.
name: Play on LAN Runners

on:
  workflow_dispatch:
    inputs:
      x_display:
        description: 'X display for Linux runners (e.g. 192.168.4.56:0). Blank = headless Xvfb.'
        required: false
        default: ''
      speed:
        description: 'Animation speed multiplier (1 = human pace, 15 = watchable, 80 = fast)'
        required: false
        default: '15'

permissions:
  contents: read

jobs:
  play:
    name: ${{ matrix.label }}
    runs-on: [self-hosted, "${{ matrix.label }}"]
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # lan-macos is handled by the shell-only job below: that machine runs
        # macOS Big Sur 11, whose dynamic linker cannot load the runner's
        # bundled Node.js, so no JavaScript action (checkout, upload-artifact)
        # can execute there.
        label: [lan-linux, lan-win10, lan-win11]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Self-hosted machines install the SDK wherever they like, and a runner
      # agent does not inherit a login shell's PATH. Find dotnet, don't assume it.
      - name: Ensure the .NET SDK is on PATH
        shell: bash
        run: |
          if ! command -v dotnet >/dev/null 2>&1; then
            for c in "$HOME/.dotnet" /opt/dotnet /usr/local/share/dotnet /usr/local/bin \
                     "/c/Program Files/dotnet" "$PROGRAMFILES/dotnet"; do
              if [ -x "$c/dotnet" ] || [ -x "$c/dotnet.exe" ]; then
                echo "$c" >> "$GITHUB_PATH"
                echo "DOTNET_ROOT=$c" >> "$GITHUB_ENV"
                echo "found .NET SDK at $c"
                break
              fi
            done
          else
            echo "dotnet already on PATH: $(command -v dotnet)"
          fi

      - name: Record machine identity
        shell: bash
        run: |
          mkdir -p proof
          {
            echo "runner label : ${{ matrix.label }}"
            echo "RUNNER_OS    : $RUNNER_OS"
            echo "RUNNER_ARCH  : $RUNNER_ARCH"
            echo "machine      : $(uname -s -m 2>/dev/null || echo 'n/a')"
            echo "dotnet SDK   : $(dotnet --version 2>/dev/null || echo 'n/a')"
          } | tee proof/environment.txt

      - name: Build (Release)
        shell: bash
        run: |
          dotnet restore LudoNimArena.slnx
          dotnet build LudoNimArena.slnx -c Release --no-restore

      - name: Play one complete game
        shell: bash
        env:
          LUDO_AUTOSTART: '1'
          LUDO_SPEED: ${{ inputs.speed }}
          LUDO_EXIT_ON_GAMEOVER: '1'
          LUDO_TRANSCRIPT: ${{ github.workspace }}/proof/transcript.txt
        run: |
          set -e
          if [ "$RUNNER_OS" = "Linux" ]; then
            export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
            if [ -n "${{ inputs.x_display }}" ]; then
              # Draw on a remote X server so the game is watchable live.
              export DISPLAY="${{ inputs.x_display }}"
              echo "displaying on $DISPLAY"
              dotnet run --project src/LudoNimArena.App -c Release --no-build
            else
              xvfb-run -a --server-args="-screen 0 1280x900x24" \
                dotnet run --project src/LudoNimArena.App -c Release --no-build
            fi
          else
            # Windows / macOS: native windowing, shown on that machine's console.
            dotnet run --project src/LudoNimArena.App -c Release --no-build
          fi

      - name: Verify a full game was completed
        shell: bash
        run: |
          T=proof/transcript.txt
          test -f "$T" || { echo "::error::no transcript produced"; exit 1; }
          grep -q '^GAME COMPLETE$' "$T" || { echo "::error::game did not reach a winner"; tail -20 "$T"; exit 1; }
          WINNER=$(grep '^WINNER: ' "$T" | tail -1)
          TURNS=$(grep '^TURNS: '  "$T" | tail -1 | cut -d' ' -f2)
          echo "$WINNER  ($TURNS turns)"
          {
            echo "### ${{ matrix.label }} — $RUNNER_OS / $RUNNER_ARCH (self-hosted)"
            echo ""
            echo "- ${WINNER}"
            echo "- turns: $TURNS"
            echo "- transcript lines: $(wc -l < "$T" | tr -d ' ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-proof-${{ matrix.label }}
          path: proof/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS Big Sur 11: shell-only job.
  #
  # The runner agent ships its own Node.js, built for a newer macOS. On Big Sur
  # it aborts with a dyld "Symbol not found" error, so every JavaScript-based
  # action fails before it starts — including actions/checkout and
  # actions/upload-artifact. The application itself is perfectly happy there,
  # so this job does the same work using only shell steps: git for the
  # checkout, and the proof left on the machine instead of uploaded.
  # ---------------------------------------------------------------------------
  play-macos:
    name: lan-macos (shell-only)
    runs-on: [self-hosted, lan-macos]
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Check out with git (no JavaScript actions)
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/ludo-ci" && mkdir -p "$HOME/ludo-ci"
          git clone --depth 1 https://github.com/tuklusan/Ludo-Arena.git "$HOME/ludo-ci/repo"
          cd "$HOME/ludo-ci/repo" && git log --oneline -1

      - name: Record machine identity
        shell: bash
        run: |
          set -e
          export PATH="$HOME/.dotnet:$PATH"; export DOTNET_ROOT="$HOME/.dotnet"
          mkdir -p "$HOME/ludo-ci/repo/proof"
          {
            echo "runner label : lan-macos (shell-only)"
            echo "RUNNER_OS    : $RUNNER_OS"
            echo "RUNNER_ARCH  : $RUNNER_ARCH"
            echo "machine      : $(uname -s -m)"
            echo "macOS        : $(sw_vers -productVersion 2>/dev/null || echo n/a)"
            echo "dotnet SDK   : $(dotnet --version)"
          } | tee "$HOME/ludo-ci/repo/proof/environment.txt"

      - name: Build (Release)
        shell: bash
        run: |
          set -e
          export PATH="$HOME/.dotnet:$PATH"; export DOTNET_ROOT="$HOME/.dotnet"
          cd "$HOME/ludo-ci/repo"
          dotnet restore LudoNimArena.slnx
          dotnet build LudoNimArena.slnx -c Release --no-restore

      - name: Play one complete game
        shell: bash
        env:
          LUDO_AUTOSTART: '1'
          LUDO_SPEED: ${{ inputs.speed }}
          LUDO_EXIT_ON_GAMEOVER: '1'
        run: |
          set -e
          export PATH="$HOME/.dotnet:$PATH"; export DOTNET_ROOT="$HOME/.dotnet"
          cd "$HOME/ludo-ci/repo"
          export LUDO_TRANSCRIPT="$HOME/ludo-ci/repo/proof/transcript.txt"
          dotnet run --project src/LudoNimArena.App -c Release --no-build

      - name: Verify a full game was completed
        shell: bash
        run: |
          T="$HOME/ludo-ci/repo/proof/transcript.txt"
          test -f "$T" || { echo "::error::no transcript produced"; exit 1; }
          grep -q '^GAME COMPLETE$' "$T" || { echo "::error::game did not reach a winner"; tail -20 "$T"; exit 1; }
          WINNER=$(grep '^WINNER: ' "$T" | tail -1)
          TURNS=$(grep '^TURNS: '  "$T" | tail -1 | cut -d' ' -f2)
          echo "$WINNER  ($TURNS turns)"
          {
            echo "### lan-macos — macOS Big Sur (self-hosted, shell-only)"
            echo ""
            echo "- ${WINNER}"
            echo "- turns: $TURNS"
            echo "- proof kept on the machine at \`~/ludo-ci/repo/proof/\` (artifact upload needs JavaScript)"
          } >> "$GITHUB_STEP_SUMMARY"
