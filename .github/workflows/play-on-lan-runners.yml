#
# Plays a full game on SELF-HOSTED runners (real machines on a private LAN).
#
# SECURITY: manual dispatch only. This workflow must never be given a
# pull_request trigger — self-hosted runners on a public repository would then
# execute untrusted fork code on real hardware.
#
# Hosted runners give you a curated image; self-hosted runners give you whatever
# that machine happens to be. Hence one job per platform rather than one matrix:
#   * Linux   — bash, and can draw on a remote X server so the game is watchable
#   * Windows — cmd, because these boxes have no Git-for-Windows (so no `bash`)
#               and a Restricted PowerShell policy blocks the runner's .ps1 steps
#   * macOS   — shell only, because the Big Sur machine cannot run the runner's
#               bundled Node.js and so cannot execute any JavaScript action
name: Play on LAN Runners

on:
  workflow_dispatch:
    inputs:
      x_display:
        description: 'X display for the Linux runner (e.g. 192.168.4.56:0). Blank = headless Xvfb.'
        required: false
        default: ''
      speed:
        description: 'Animation speed multiplier (1 = human pace, 15 = watchable, 80 = fast)'
        required: false
        default: '15'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux — can render to a remote X server (MobaXterm on a desktop).
  # ---------------------------------------------------------------------------
  play-linux:
    name: lan-linux
    runs-on: [self-hosted, lan-linux]
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure the .NET SDK is on PATH
        shell: bash
        run: |
          if ! command -v dotnet >/dev/null 2>&1; then
            for c in "$HOME/.dotnet" /opt/dotnet /usr/local/share/dotnet /usr/local/bin; do
              if [ -x "$c/dotnet" ]; then
                echo "$c" >> "$GITHUB_PATH"
                echo "DOTNET_ROOT=$c" >> "$GITHUB_ENV"
                echo "found .NET SDK at $c"
                break
              fi
            done
          else
            echo "dotnet already on PATH: $(command -v dotnet)"
          fi

      - name: Record machine identity
        shell: bash
        run: |
          mkdir -p proof
          {
            echo "runner label : lan-linux"
            echo "RUNNER_OS    : $RUNNER_OS"
            echo "RUNNER_ARCH  : $RUNNER_ARCH"
            echo "machine      : $(uname -s -m)"
            echo "dotnet SDK   : $(dotnet --version)"
          } | tee proof/environment.txt

      - name: Build (Release)
        shell: bash
        run: |
          dotnet restore LudoNimArena.slnx
          dotnet build LudoNimArena.slnx -c Release --no-restore

      - name: Play one complete game
        shell: bash
        env:
          LUDO_AUTOSTART: '1'
          LUDO_SPEED: ${{ inputs.speed }}
          LUDO_EXIT_ON_GAMEOVER: '1'
          LUDO_TRANSCRIPT: ${{ github.workspace }}/proof/transcript.txt
          LUDO_SCREENSHOT: ${{ github.workspace }}/proof/board
          LUDO_SCREENSHOT_INTERVAL: '20'
        run: |
          set -e
          export LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          if [ -n "${{ inputs.x_display }}" ]; then
            export DISPLAY="${{ inputs.x_display }}"
            echo "drawing on remote X display $DISPLAY"
            dotnet run --project src/LudoNimArena.App -c Release --no-build
          else
            xvfb-run -a --server-args="-screen 0 1280x900x24" \
              dotnet run --project src/LudoNimArena.App -c Release --no-build
          fi

      - name: Verify a full game was completed
        shell: bash
        run: |
          T=proof/transcript.txt
          test -f "$T" || { echo "::error::no transcript produced"; exit 1; }
          grep -q '^GAME COMPLETE$' "$T" || { echo "::error::game did not reach a winner"; tail -20 "$T"; exit 1; }
          WINNER=$(grep '^WINNER: ' "$T" | tail -1)
          TURNS=$(grep '^TURNS: '  "$T" | tail -1 | cut -d' ' -f2)
          echo "$WINNER  ($TURNS turns)"
          {
            echo "### lan-linux — $RUNNER_OS / $RUNNER_ARCH (self-hosted)"
            echo ""
            echo "- ${WINNER}"
            echo "- turns: $TURNS"
            echo "- displayed on: ${{ inputs.x_display != '' && inputs.x_display || 'headless Xvfb' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-proof-lan-linux
          path: proof/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Windows — cmd only. No Git for Windows (so no bash), and a Restricted
  # PowerShell execution policy blocks the .ps1 files the runner generates.
  # ---------------------------------------------------------------------------
  play-windows:
    name: ${{ matrix.label }}
    runs-on: [self-hosted, "${{ matrix.label }}"]
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        label: [lan-win10, lan-win11]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # These steps use cmd, not PowerShell, and deliberately so. The runner
      # writes every `shell: powershell` step to a temporary .ps1 file, which a
      # Restricted PowerShell execution policy refuses to load
      # ("running scripts is disabled on this system"). Execution policy governs
      # script FILES, not inline `-Command` strings — so cmd (optionally calling
      # `powershell -NoProfile -Command`) works on a locked-down machine without
      # changing any security setting. This is the same tether used to drive
      # these two machines in Part 3.
      - name: Record machine identity
        shell: cmd
        run: |
          if not exist proof mkdir proof
          (
            echo runner label : ${{ matrix.label }}
            echo RUNNER_OS    : %RUNNER_OS%
            echo RUNNER_ARCH  : %RUNNER_ARCH%
            echo machine      : %PROCESSOR_ARCHITECTURE%
            echo windows      : %OS%
          ) > proof\environment.txt
          for /f "delims=" %%V in ('dotnet --version') do echo dotnet SDK   : %%V>> proof\environment.txt
          type proof\environment.txt

      - name: Build (Release)
        shell: cmd
        run: |
          dotnet restore LudoNimArena.slnx || exit /b 1
          dotnet build LudoNimArena.slnx -c Release --no-restore || exit /b 1

      - name: Play one complete game
        shell: cmd
        env:
          LUDO_AUTOSTART: '1'
          LUDO_SPEED: ${{ inputs.speed }}
          LUDO_EXIT_ON_GAMEOVER: '1'
          LUDO_TRANSCRIPT: ${{ github.workspace }}\proof\transcript.txt
          LUDO_SCREENSHOT: ${{ github.workspace }}\proof\board
          LUDO_SCREENSHOT_INTERVAL: '20'
        run: dotnet run --project src\LudoNimArena.App -c Release --no-build || exit /b 1

      - name: Verify a full game was completed
        shell: cmd
        run: |
          set "T=proof\transcript.txt"
          if not exist "%T%" ( echo ::error::no transcript produced & exit /b 1 )
          findstr /b /c:"GAME COMPLETE" "%T%" >nul || ( echo ::error::game did not reach a winner & exit /b 1 )
          for /f "delims=" %%A in ('findstr /b /c:"WINNER: " "%T%"') do set "WINNER=%%A"
          for /f "tokens=2" %%B in ('findstr /b /c:"TURNS: " "%T%"') do set "TURNS=%%B"
          for /f %%C in ('find /c /v "" ^< "%T%"') do set "LINES=%%C"
          echo %WINNER%  (%TURNS% turns^)
          >>"%GITHUB_STEP_SUMMARY%" echo ### ${{ matrix.label }} — %RUNNER_OS% / %RUNNER_ARCH% (self-hosted^)
          >>"%GITHUB_STEP_SUMMARY%" echo.
          >>"%GITHUB_STEP_SUMMARY%" echo - %WINNER%
          >>"%GITHUB_STEP_SUMMARY%" echo - turns: %TURNS%
          >>"%GITHUB_STEP_SUMMARY%" echo - transcript lines: %LINES%

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lan-proof-${{ matrix.label }}
          path: proof/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # macOS Big Sur 11 — shell-only job.
  #
  # The runner agent ships its own Node.js, built for a newer macOS. On Big Sur
  # the dynamic linker aborts with "Symbol not found" before any JavaScript
  # action can start, so actions/checkout and actions/upload-artifact are both
  # unusable. The application itself is perfectly happy there, so this job does
  # the same work with shell steps only: git for the checkout, and the proof
  # left on the machine instead of uploaded.
  # ---------------------------------------------------------------------------
  play-macos:
    name: lan-macos (shell-only)
    runs-on: [self-hosted, lan-macos]
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Check out with git (no JavaScript actions)
        shell: bash
        run: |
          set -e
          rm -rf "$HOME/ludo-ci" && mkdir -p "$HOME/ludo-ci"
          git clone --depth 1 https://github.com/tuklusan/Ludo-Arena.git "$HOME/ludo-ci/repo"
          cd "$HOME/ludo-ci/repo" && git log --oneline -1

      - name: Record machine identity
        shell: bash
        run: |
          set -e
          export PATH="$HOME/.dotnet:$PATH"; export DOTNET_ROOT="$HOME/.dotnet"
          mkdir -p "$HOME/ludo-ci/repo/proof"
          {
            echo "runner label : lan-macos (shell-only)"
            echo "RUNNER_OS    : $RUNNER_OS"
            echo "RUNNER_ARCH  : $RUNNER_ARCH"
            echo "machine      : $(uname -s -m)"
            echo "macOS        : $(sw_vers -productVersion 2>/dev/null || echo n/a)"
            echo "dotnet SDK   : $(dotnet --version)"
          } | tee "$HOME/ludo-ci/repo/proof/environment.txt"

      - name: Build (Release)
        shell: bash
        run: |
          set -e
          export PATH="$HOME/.dotnet:$PATH"; export DOTNET_ROOT="$HOME/.dotnet"
          cd "$HOME/ludo-ci/repo"
          dotnet restore LudoNimArena.slnx
          dotnet build LudoNimArena.slnx -c Release --no-restore

      - name: Play one complete game
        shell: bash
        env:
          LUDO_AUTOSTART: '1'
          LUDO_SPEED: ${{ inputs.speed }}
          LUDO_EXIT_ON_GAMEOVER: '1'
        run: |
          set -e
          export PATH="$HOME/.dotnet:$PATH"; export DOTNET_ROOT="$HOME/.dotnet"
          cd "$HOME/ludo-ci/repo"
          export LUDO_TRANSCRIPT="$HOME/ludo-ci/repo/proof/transcript.txt"
          export LUDO_SCREENSHOT="$HOME/ludo-ci/repo/proof/board"
          export LUDO_SCREENSHOT_INTERVAL=20
          dotnet run --project src/LudoNimArena.App -c Release --no-build

      - name: Verify a full game was completed
        shell: bash
        run: |
          T="$HOME/ludo-ci/repo/proof/transcript.txt"
          test -f "$T" || { echo "::error::no transcript produced"; exit 1; }
          grep -q '^GAME COMPLETE$' "$T" || { echo "::error::game did not reach a winner"; tail -20 "$T"; exit 1; }
          WINNER=$(grep '^WINNER: ' "$T" | tail -1)
          TURNS=$(grep '^TURNS: '  "$T" | tail -1 | cut -d' ' -f2)
          echo "$WINNER  ($TURNS turns)"
          {
            echo "### lan-macos — macOS Big Sur (self-hosted, shell-only)"
            echo ""
            echo "- ${WINNER}"
            echo "- turns: $TURNS"
            echo "- proof kept on the machine at \`~/ludo-ci/repo/proof/\` (artifact upload needs JavaScript)"
          } >> "$GITHUB_STEP_SUMMARY"
